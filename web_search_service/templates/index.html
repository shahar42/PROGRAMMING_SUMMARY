<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C/C++ Concept Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>
                    <span class="cyan">C/C++ Concept Search</span>
                </h1>
                <p class="subtitle">Enhanced semantic search with context-aware AI tutoring</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-wrapper">
                    <span class="search-icon">→</span>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search: what is RAII? malloc vs new? virtual functions?"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="searchBtn" class="search-btn">
                        <span id="searchBtnText">Search</span>
                        <span id="searchSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </div>
            </section>

            <!-- Results Section -->
            <section id="resultsSection" class="results-section" style="display: none;">
                <!-- Book Legend -->
                <div id="bookLegend" class="book-legend"></div>

                <!-- Summary Table -->
                <div id="summaryTable" class="summary-table"></div>

                <!-- Results List -->
                <div class="results-wrapper">
                    <div id="resultsList" class="results-list"></div>

                    <!-- Load More -->
                    <div id="loadMoreContainer" class="load-more-container" style="display: none;">
                        <button id="loadMoreBtn" class="btn btn-secondary">
                            Show All Results
                        </button>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div class="filter-controls">
                    <button id="filterBtn" class="btn btn-secondary">
                        Filter by Book
                    </button>
                    <button id="newSearchBtn" class="btn btn-secondary">
                        New Search
                    </button>
                </div>
            </section>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Enter a search query to get started</p>
            </div>

            <!-- No Results -->
            <div id="noResults" class="no-results" style="display: none;">
                <p>No concepts found for your query</p>
                <p class="hint">Try different search terms</p>
            </div>
        </main>
    </div>

    <!-- Modals -->

    <!-- Concept Detail Modal -->
    <div id="conceptModal" class="modal" style="display: none;">
        <div class="modal-overlay" id="conceptOverlay"></div>
        <div class="modal-content concept-modal">
            <button class="modal-close" id="closeConceptBtn">&times;</button>

            <div id="conceptDetail" class="concept-detail-content"></div>

            <div class="concept-actions">
                <button id="chatBtn" class="btn btn-primary" style="display: none;">
                    💬 Chat About This
                </button>
                <button id="codeBtn" class="btn btn-secondary" style="display: none;">
                    {'{'} Code Example
                </button>
                <button id="backBtn" class="btn btn-secondary">
                    ← Back to Results
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal" style="display: none;">
        <div class="modal-overlay" id="chatOverlay"></div>
        <div class="modal-content chat-modal">
            <button class="modal-close" id="closeChatBtn">&times;</button>

            <div class="chat-header">
                <h2 id="chatTitle">Chat</h2>
                <p class="chat-subtitle">Type 'exit' to return</p>
            </div>

            <div id="chatHistory" class="chat-history"></div>

            <div class="chat-input-section">
                <textarea
                    id="chatInput"
                    class="chat-input"
                    placeholder="Ask a question..."
                    rows="3"
                ></textarea>
                <button id="sendChatBtn" class="btn btn-primary">
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- Filter Modal -->
    <div id="filterModal" class="modal" style="display: none;">
        <div class="modal-overlay" id="filterOverlay"></div>
        <div class="modal-content filter-modal">
            <button class="modal-close" id="closeFilterBtn">&times;</button>

            <h2>Filter by Book</h2>
            <div id="filterOptions" class="filter-options"></div>

            <div class="filter-actions">
                <button id="cancelFilterBtn" class="btn btn-secondary">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notifications" class="notifications">
        <div id="errorNotification" class="notification error" style="display: none;">
            <span id="errorText"></span>
            <button class="notification-close">&times;</button>
        </div>
        <div id="successNotification" class="notification success" style="display: none;">
            <span id="successText"></span>
            <button class="notification-close">&times;</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
